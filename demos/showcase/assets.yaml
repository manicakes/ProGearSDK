# Template game assets
# Uses the unified visual_assets format

# Ball color palettes - 8 variations for multi-colored balls
# Color 0 = transparent, Colors 1-3 = ball shading (highlight, mid, shadow)
palettes:
  ball_default:
    source: assets/ball.png    # Extract original orange palette

  ball_red:
    colors: [0x8000, 0x4F00, 0x2D00, 0x0A00, 0x0000, 0x0000, 0x0000, 0x0000,
             0x0000, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000]

  ball_green:
    colors: [0x8000, 0x20F0, 0x00D0, 0x00A0, 0x0000, 0x0000, 0x0000, 0x0000,
             0x0000, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000]

  ball_blue:
    colors: [0x8000, 0x100F, 0x000D, 0x000A, 0x0000, 0x0000, 0x0000, 0x0000,
             0x0000, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000]

  ball_yellow:
    colors: [0x8000, 0x6FF0, 0x4DD0, 0x2AA0, 0x0000, 0x0000, 0x0000, 0x0000,
             0x0000, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000]

  ball_cyan:
    colors: [0x8000, 0x30FF, 0x00DD, 0x00AA, 0x0000, 0x0000, 0x0000, 0x0000,
             0x0000, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000]

  ball_magenta:
    colors: [0x8000, 0x5F0F, 0x3D0D, 0x1A0A, 0x0000, 0x0000, 0x0000, 0x0000,
             0x0000, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000]

  ball_white:
    colors: [0x8000, 0x7FFF, 0x5DDD, 0x3AAA, 0x0000, 0x0000, 0x0000, 0x0000,
             0x0000, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000]

  # Dithered shadow palette - index 0 transparent, index 1 black
  dithered_shadow:
    colors: [0x8000, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000,
             0x0000, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000]

  # Storm recolor of the checkerboard (backdrop under the rain effect):
  # index 1 = pale blue square, index 2 = dark storm blue square
  checkerboard_rain:
    colors: [0x8000, 0x2358, 0x0124, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000,
             0x0000, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000, 0x0000]

visual_assets:
  # Animated ball sprite (uses default orange palette) - 32x32 size
  - name: ball
    source: assets/ball.png
    frame_size: [32, 32]
    palette: ball_default
    animations:
      spin: { frames: [0-15], speed: 1, loop: true }

  # Brick wall
  - name: brick
    source: assets/brick.png

  # Brick shadow (dithered checkerboard for fake alpha)
  - name: brick_shadow
    source: assets/brick_shadow.png
    palette: dithered_shadow

  # Brick pattern (tiling background for ball demo)
  - name: brick_pattern
    source: assets/brick_pattern.png

  # Simple tileset for tilemap demo (2 tiles: empty, solid)
  - name: tiles_simple
    source: assets/tiles_simple.png

  # Checkerboard texture (tiled full-screen by the raster demo heat wave effect)
  - name: checkerboard
    source: assets/checkerboard.png

  # Sparse rain streaks on storm sky (raster demo rain effect)
  - name: rain_streaks
    source: assets/rain_streaks.png

  # Parallax cloud layers (tilemap demo background)
  - name: cloud_far
    source: assets/cloud_far.png

  - name: cloud_mid
    source: assets/cloud_mid.png

  - name: cloud_near
    source: assets/cloud_near.png

  # --- Hitbox showcase (tilemap demo) ---

  # Player bullet. One hitbox covering the pellet; nothing else, since a
  # bullet is never hurt or stood on.
  - name: bullet
    source: assets/bullet.png
    boxes:
      default:
        hit: [4, 5, 8, 6]

  # Walking enemy. Its hurtbox is derived from the artwork, so it stays
  # correct if the sprite is redrawn. The separate 'stomp' box across the
  # shoulders is what the player lands on - keeping it distinct from the
  # hurtbox is what lets a stomp read differently from a bullet.
  - name: walker
    source: assets/walker.png
    frame_size: [32, 32]
    animations:
      walk: { frames: [0-1], speed: 12, loop: true }
    boxes:
      default:
        hurt: auto
        body: [6, 10, 20, 20]
        user1: [6, 8, 20, 6]

  # Parallax scrolling layers (for scroll demo)
  - name: back_layer
    source: assets/back.png

  - name: middle_layer
    source: assets/middle.png

  - name: front_layer
    source: assets/front.png

# Sound effects (ADPCM-A)
sound_effects:
  - name: ball_hit
    source: assets/ball_hit.wav

  # Drum kit for the sequenced song in the tilemap demo (tools/gen_drums.py).
  # The whole kit is ~6 KB of V-ROM; the same 26-second loop streamed as
  # ADPCM-B would be ~240 KB.
  - name: kick
    source: assets/kick.wav
  - name: snare
    source: assets/snare.wav
  - name: hihat_closed
    source: assets/hihat_closed.wav
  - name: hihat_open
    source: assets/hihat_open.wav

# Sequenced songs (YM2610 FM + SSG, note data in M1 ROM)
songs:
  - name: downtown
    source: assets/downtown.yaml

# Background music (ADPCM-B)
music:
  - name: ball_scene_music
    source: assets/ball_scene_music.wav
    loop: true

# Tilemaps
tilemaps:
  - name: tilemap_demo_level
    source: assets/tilemap_demo_level.tmx
    layer: "Ground"
    tileset: tiles_simple
    default_palette: 16  # NGPAL_TILES_SIMPLE

# Game-specific lighting presets - pre-baked palette variants
# Night transition with smooth fade animation
lighting_presets:
  night:
    brightness: 0.65
    tint: [-8, -5, 12]  # Blue-ish night tint (RGB shift)
    fade_steps: 16  # Smooth day-to-night transition
